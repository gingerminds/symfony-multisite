services:
    _defaults:
        autowire: true
        autoconfigure: true

    Gingerminds\MultisiteBundle\Tests\Application\Form\:
        resource: '../Form/'

    Gingerminds\MultisiteBundle\Tests\Application\Controller\:
        resource: '../Controller/'
        tags: ['controller.service_arguments']

    # No Google Drive call in the tests.
    gingerminds_multisite.translation.source:
        class: Gingerminds\MultisiteBundle\Tests\Application\Translation\FakeTranslationSource

    test.rate_limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    # Keep PHPUnit output clean (the default logger writes errors to stderr).
    logger:
        class: Psr\Log\NullLogger
