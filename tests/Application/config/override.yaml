# `override` environment: the project overrides the bundle Site entity.
doctrine:
    orm:
        mappings:
            TestOverride:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/Override'
                prefix: 'Gingerminds\MultisiteBundle\Tests\Application\Override'

gingerminds_multisite:
    resources:
        site:
            entity: Gingerminds\MultisiteBundle\Tests\Application\Override\Site
